<script>
  window.__cbCurrentAmount = 0;

  function scrapeCashbackFromDOM() {
    var el = document.getElementById('cashback-smart-value-amount');
    if (el && el.innerText) {
      var n = parseFloat(el.innerText.replace(/[^0-9.]/g, ''));
      if (!isNaN(n)) return n;
    }
    var card = document.getElementById('cashback-smart-value-card');
    if (card) {
      var p = card.querySelector('p');
      if (p && p.innerText) {
        var n = parseFloat(p.innerText.replace(/[^0-9.]/g, ''));
        if (!isNaN(n)) return n;
      }
    }
    var spans = document.querySelectorAll('span');
    for (var i = 0; i < spans.length; i++) {
      if (spans[i].innerText && spans[i].innerText.trim().toLowerCase() === 'cashback') {
        var p = spans[i].parentElement ? spans[i].parentElement.querySelector('p') : null;
        if (p && p.innerText) {
          var n = parseFloat(p.innerText.replace(/[^0-9.]/g, ''));
          if (!isNaN(n)) return n;
        }
      }
    }
    return 0;
  }

  function scrapeWalletFromDOM() {
    var el = document.getElementById('smart-value-wallet-amount');

      if (!isNaN(n)) return n;
    }
    var spans = document.querySelectorAll('span');
    for (var i = 0; i < spans.length; i++) {
      if (spans[i].innerText && spans[i].innerText.trim().toLowerCase() === 'smart value') {
        var p = spans[i].parentElement ? spans[i].parentElement.querySelector('p') : null;
        if (p && p.innerText) {
          var n = parseFloat(p.innerText.replace(/[^0-9.]/g, ''));
          if (!isNaN(n)) return n;
        }
      }
    }
    return 0;
  }

  window.openCashbackConvertModal = function(amount, walletBalance, userId, isDark, isDriver) {
    var rawAmount = Number(amount || 0);
    if (rawAmount <= 0) {
      rawAmount = scrapeCashbackFromDOM();
    }

    var currentWallet = Number(walletBalance || 0);
    if (currentWallet <= 0) {
      currentWallet = scrapeWalletFromDOM();
    }

    var threshold = (typeof window.__MIN_CASHBACK_THRESHOLD !== 'undefined' && window.__MIN_CASHBACK_THRESHOLD !== null)
      ? Number(window.__MIN_CASHBACK_THRESHOLD)
      : 1.00;

    if (window.__CURRENT_WALLET_DATA) {
      if (window.__CURRENT_WALLET_DATA.min_cashback_redeem_threshold) {
        threshold = Number(window.__CURRENT_WALLET_DATA.min_cashback_redeem_threshold);
      }
      if (rawAmount <= 0) {
        if (window.__CURRENT_WALLET_DATA.cashback_balance !== undefined) {
          rawAmount = Number(window.__CURRENT_WALLET_DATA.cashback_balance);
        } else if (window.__CURRENT_WALLET_DATA.earn_amount !== undefined) {
          rawAmount = Number(window.__CURRENT_WALLET_DATA.earn_amount);
        }
      }
      if (currentWallet <= 0 && window.__CURRENT_WALLET_DATA.amount !== undefined) {
        currentWallet = Number(window.__CURRENT_WALLET_DATA.amount);
      }
    }

    var params = new URLSearchParams(window.location.search);
    window.__cbCurrentAmount = rawAmount;
    window.__cbTargetThreshold = threshold;
    window.__cbWalletBalance = currentWallet;
    window.__cbUserId = userId || (params.get('id_user') || params.get('driver_id') || params.get('user_id') || params.get('userId'));
    window.__cbIsDriver = (typeof isDriver !== 'undefined' && isDriver !== null)
      ? Boolean(isDriver)
      : (params.get('user_cat') === 'driver' || params.get('user_type') === 'driver');

    // Theme Detection: supports param 'theme', class 'dark', or arg isDark
    var isDarkTheme = false;
    if (typeof isDark !== 'undefined' && isDark !== null) {
      isDarkTheme = (isDark === true || isDark === 'true' || isDark === '1' || isDark === 'dark');
    } else {
      var qTheme = params.get('theme');
      if (qTheme === 'dark' || qTheme === '1' || qTheme === 'true') {
        isDarkTheme = true;
      } else if (qTheme === 'light' || qTheme === '0' || qTheme === 'false') {
        isDarkTheme = false;
      } else {
        isDarkTheme = document.documentElement.classList.contains('dark') ||
                      document.body.classList.contains('dark') ||
                      (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      }
    }

    var sheet = document.getElementById('cashback-convert-sheet');
    if (sheet) {
      sheet.classList.remove('cb-theme-light', 'cb-theme-dark');
      sheet.classList.add(isDarkTheme ? 'cb-theme-dark' : 'cb-theme-light');
      sheet.classList.add('active');
    }

    document.getElementById('cb-display-amount').innerText = '₹' + rawAmount.toFixed(2);
    document.getElementById('cb-display-threshold').innerText = '₹' + threshold.toFixed(2);
    document.getElementById('cb-current-wallet-txt').innerText = '₹' + currentWallet.toFixed(2);

    var inputEl = document.getElementById('cb-input-amount');
    inputEl.value = rawAmount > 0 ? rawAmount : '';
    inputEl.max = rawAmount;

    handleAmountInput(inputEl.value);

    // Fetch authoritative balance in background if userId present
    if (window.__cbUserId) {
      var apiEndpoint = window.__cbIsDriver ? '/api/v1/show_wallet_amount/driver' : '/api/v1/show_wallet_amount/smart-value';
      var apiBody = window.__cbIsDriver ? { driver_id: window.__cbUserId } : { user_id: window.__cbUserId };
      fetch(apiEndpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(apiBody)
      }).then(function(r) { return r.json(); }).then(function(json) {
        if (json && json.data) {
          window.__CURRENT_WALLET_DATA = json.data;
          if (json.data.min_cashback_redeem_threshold) {
            window.__MIN_CASHBACK_THRESHOLD = Number(json.data.min_cashback_redeem_threshold);
            window.__cbTargetThreshold = window.__MIN_CASHBACK_THRESHOLD;
            document.getElementById('cb-display-threshold').innerText = '₹' + window.__cbTargetThreshold.toFixed(2);
          }
          if (json.data.cashback_balance !== undefined) {
            window.__cbCurrentAmount = Number(json.data.cashback_balance);
            document.getElementById('cb-display-amount').innerText = '₹' + window.__cbCurrentAmount.toFixed(2);
          }
          if (json.data.amount !== undefined) {
            window.__cbWalletBalance = Number(json.data.amount);
            document.getElementById('cb-current-wallet-txt').innerText = '₹' + window.__cbWalletBalance.toFixed(2);
          }
          handleAmountInput(document.getElementById('cb-input-amount').value);
        }
      }).catch(function(){});
    }
  };

  window.setFullCashbackAmount = function() {
    var inputEl = document.getElementById('cb-input-amount');
    inputEl.value = window.__cbCurrentAmount;
    handleAmountInput(inputEl.value);
  };

  window.handleAmountInput = function(val) {
    var amountToConvert = parseFloat(val) || 0;
    var rawAmount = window.__cbCurrentAmount;
    var threshold = window.__cbTargetThreshold;
    var currentWallet = window.__cbWalletBalance;

    var btn = document.getElementById('cb-convert-btn');
    var btnText = document.getElementById('cb-btn-text');
    var badge = document.getElementById('cb-status-badge');
    var badgeMsg = document.getElementById('cb-status-msg');
    var projectedTxt = document.getElementById('cb-projected-wallet-txt');

    var projectedTotal = currentWallet + (amountToConvert > 0 ? amountToConvert : 0);
    projectedTxt.innerText = '₹' + projectedTotal.toFixed(2);

    if (rawAmount >= threshold && rawAmount > 0) {
      if (amountToConvert <= 0) {
        btn.disabled = true;
        btn.style.opacity = '0.5';
        btnText.innerText = 'Convert to Wallet';
        badge.className = 'cb-badge-warning';
        badgeMsg.innerText = 'Enter amount to convert';
      } else if (amountToConvert > rawAmount) {
        btn.disabled = true;
        btn.style.opacity = '0.5';
        btnText.innerText = 'Convert to Wallet';
        badge.className = 'cb-badge-error';
        badgeMsg.innerText = 'Max available is ₹' + rawAmount.toFixed(2);
      } else {
        btn.disabled = false;
        btn.style.opacity = '1';
        btnText.innerText = 'Convert ₹' + amountToConvert.toFixed(2) + ' to Wallet';
        badge.className = 'cb-badge-ready';
        badgeMsg.innerText = '✓ Ready to convert to wallet';
      }
    } else {
      btn.disabled = true;
      btn.style.opacity = '0.5';
      btnText.innerText = 'Convert to Wallet';
      var diff = Math.max(0, threshold - rawAmount);
      badge.className = 'cb-badge-warning';
      badgeMsg.innerText = 'Min. ₹' + threshold.toFixed(0) + ' required (need ₹' + diff.toFixed(2) + ' more)';
    }
  };

  window.closeCashbackConvertModal = function() {
    var sheet = document.getElementById('cashback-convert-sheet');
    if (sheet) sheet.classList.remove('active');
  };

  window.handleSheetBackdropClick = function(e) {
    if (e.target.id === 'cashback-convert-sheet') {
      window.closeCashbackConvertModal();
    }
  };

  window.executeCashbackConvert = async function() {
    var inputEl = document.getElementById('cb-input-amount');
    var convertAmt = parseFloat(inputEl.value) || window.__cbCurrentAmount;

    var btn = document.getElementById('cb-convert-btn');
    var btnText = document.getElementById('cb-btn-text');
    btn.disabled = true;
    btnText.innerText = 'Converting...';

    var payload = {
      user_id: window.__cbUserId,
      user_type: window.__cbIsDriver ? 'driver' : 'customer',
      amount: convertAmt
    };

    try {
      var res = await fetch('/api/v1/cashback/convert-to-wallet', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify(payload)
      });
      var data = await res.json();

      if (res.ok && data.res === 'success') {
        btnText.innerText = 'Converted! ✓';
        alert(data.msg || 'Cashback converted to wallet successfully!');
        window.closeCashbackConvertModal();
        window.location.reload();
      } else {
        alert(data.msg || 'Unable to convert cashback at this time.');
        btn.disabled = false;
        btnText.innerText = 'Convert to Wallet';
      }
    } catch (err) {
      alert('Network error while converting cashback. Please try again.');
      btn.disabled = false;
      btnText.innerText = 'Convert to Wallet';
    }
  };

  // Fallback click listener (non-capturing phase so React onClick runs first)
  document.addEventListener('click', function(e) {
    var target = e.target;
    var sheet = document.getElementById('cashback-convert-sheet');
    if (sheet && sheet.contains(target)) return;

    var card = target.closest('#cashback-smart-value-card');
    if (!card) {
      var p = target.closest('div');
      while (p && p !== document.body) {
        if (p.innerText && p.innerText.includes('Cashback') && (p.className.includes('rounded-2xl') || p.innerText.length < 50)) {
          card = p;
          break;
        }
        p = p.parentElement;
      }
    }

    if (card) {
      if (sheet && sheet.classList.contains('active')) return;
      var amt = scrapeCashbackFromDOM();
      var wBal = scrapeWalletFromDOM();
      window.openCashbackConvertModal(amt, wBal);
    }
  });
</script>
</body></html>
